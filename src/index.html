<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #background-root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
      }
      #tabbar-root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 35px;
        z-index: 1000;
        pointer-events: auto;
      }
      #desktop-root {
        position: fixed;
        top: 35px;
        left: 0;
        width: 100vw;
        bottom: 0;
        z-index: 1;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="background-root"></div>
    <div id="tabbar-root"></div>
    <div id="desktop-root"></div>
    <script type="module" src="./Main.jsx"></script>
  </body>
</html>

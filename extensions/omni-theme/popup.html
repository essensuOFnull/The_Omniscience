<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Omni Theme</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      width: 270px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      background: #1a001a;
      color: #fff;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: #a855f7;
    }
    label { display: block; margin-bottom: 10px; }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      color: #ccc;
      font-size: 12px;
    }
    input[type="range"] { width: 100%; accent-color: #a855f7; }
    input[type="number"] {
      width: 60px;
      background: #2a002a;
      border: 1px solid #50005099;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #50005099;
    }
    .toggle input { accent-color: #a855f7; }
    .hint {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #50005099;
      color: #888;
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>🎨 Omni Theme</h3>

  <div class="toggle">
    <input type="checkbox" id="enabled" />
    <label for="enabled" style="margin: 0; cursor: pointer;">Включить тему</label>
  </div>

  <label>
    <div class="label-row">
      <span>Max R</span>
      <input type="number" id="maxR-num" min="0" max="255" />
    </div>
    <input type="range" id="maxR" min="0" max="255" />
  </label>

  <label>
    <div class="label-row">
      <span>Max G</span>
      <input type="number" id="maxG-num" min="0" max="255" />
    </div>
    <input type="range" id="maxG" min="0" max="255" />
  </label>

  <label>
    <div class="label-row">
      <span>Max B</span>
      <input type="number" id="maxB-num" min="0" max="255" />
    </div>
    <input type="range" id="maxB" min="0" max="255" />
  </label>

  <label>
    <div class="label-row">
      <span>Target Alpha</span>
      <input type="number" id="targetAlpha-num" min="0" max="1" step="0.05" />
    </div>
    <input type="range" id="targetAlpha" min="0" max="1" step="0.05" />
  </label>

  <label>
    <div class="label-row">
      <span>Text Brightness</span>
      <input type="number" id="textBrightness-num" min="0" max="255" />
    </div>
    <input type="range" id="textBrightness" min="0" max="255" />
  </label>

  <div class="hint">
    Настройки применяются мгновенно во всех открытых вкладках.
    Отключение темы действует после перезагрузки страницы.
  </div>

  <script src="popup.js"></script>
</body>
</html>

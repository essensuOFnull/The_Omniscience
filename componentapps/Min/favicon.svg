<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C4DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:1" />
      <animate attributeName="x1" values="0%;100%;0%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y2" values="100%;0%;100%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      @keyframes spin1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spin2 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes glitchPulse {
        0%, 100% { r: 120; opacity: 0.3; stroke: #fff; }
        25% { r: 140; opacity: 0.8; stroke: #ff0; }
        50% { r: 100; opacity: 0.1; stroke: #0ff; }
        75% { r: 150; opacity: 0.6; stroke: #f0f; }
      }
      @keyframes hueShift {
        0% { filter: hue-rotate(0deg); }
        100% { filter: hue-rotate(360deg); }
      }
      .arrows1 {
        transform-origin: 256px 256px;
        animation: spin1 1s linear infinite;
      }
      .arrows2 {
        transform-origin: 256px 256px;
        animation: spin2 1s linear infinite;
      }
      .center-glitch {
        animation: glitchPulse 1.2s steps(2) infinite;
      }
      .hue-rotate {
        animation: hueShift 5s linear infinite;
      }
    </style>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="url(#grad)" class="hue-rotate" />
  
  <!-- Первый слой стрелок (быстрое вращение) -->
  <g class="arrows1">
    <path d="M160 256 L240 176 M240 176 L240 240 M240 176 L320 176" 
          stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
  <!-- Второй слой стрелок (в обратную сторону с другой скоростью) -->
  <g class="arrows2">
    <path d="M352 256 L272 336 M272 336 L272 272 M272 336 L192 336" 
          stroke="#FFDD00" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
  
  <!-- Глитч-круг -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-width="12" class="center-glitch" />
</svg>
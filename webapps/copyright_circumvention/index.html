<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suno Оbfuscator v3</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e6e8eb;
    max-width: 1000px; margin: 0 auto; padding: 24px; line-height: 1.5;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b92a0; font-size: 14px; margin-bottom: 20px; }
  textarea {
    width: 100%; min-height: 170px; padding: 12px;
    background: #171a21; color: #e6e8eb;
    border: 1px solid #2a2f3a; border-radius: 8px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 14px; resize: vertical; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #4a7cff; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  button {
    background: #4a7cff; color: white; border: none;
    padding: 10px 18px; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  button:hover { background: #3b6be0; }
  button.secondary { background: #2a2f3a; }
  button.secondary:hover { background: #363c48; }
  label { font-size: 14px; color: #b0b6c0; }
  select, input[type=range] { vertical-align: middle; }
  select {
    background: #171a21; color: #e6e8eb; border: 1px solid #2a2f3a;
    border-radius: 6px; padding: 6px 10px; font-size: 14px;
  }
  .controls {
    background: #171a21; border: 1px solid #2a2f3a;
    border-radius: 8px; padding: 14px 16px; margin: 12px 0;
  }
  .scripts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
  .scripts label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .rate-val { display: inline-block; min-width: 44px; color: #4a7cff; font-weight: 600; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
  .sep-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .sep-row label { display: flex; align-items: center; gap: 6px; }
  .opt-row { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px; align-items: center; padding-top: 12px; border-top: 1px solid #232833; }
  #output { min-height: 170px; }
</style>
</head>
<body>

<h1>🎵 Suno Оbfuscator v3</h1>
<div class="sub">Расширенная катакана с ヴ・ファ・ティ・ツァ. Скобки [Verse] не трогаются.</div>

<textarea id="input" placeholder="Вставь текст сюда..."></textarea>

<div class="controls">
  <div class="row" style="margin:0">
    <label>Интенсивность:</label>
    <input type="range" id="rate" min="0" max="100" value="50" style="flex:1;max-width:300px">
    <span class="rate-val" id="rateVal">50%</span>
  </div>

  <div class="scripts" id="scripts">
    <label><input type="checkbox" data-script="katakana" checked> カタカナ (расширенная)</label>
    <label><input type="checkbox" data-script="hiragana"> ひらがな</label>
    <label><input type="checkbox" data-script="latin"> Латиница</label>
    <label><input type="checkbox" data-script="greek" checked> Греческий</label>
    <label><input type="checkbox" data-script="armenian"> Армянский</label>
    <label><input type="checkbox" data-script="cyrillic"> Кириллица-гомоглифы</label>
  </div>

  <div class="sep-row">
    <label>Между слогами:
      <select id="syllSep">
        <option value="">нет</option>
        <option value="・" selected>・</option>
        <option value="　">　 (U+3000)</option>
        <option value="-">-</option>
      </select>
    </label>
    <label>Между словами:
      <select id="wordSep">
        <option value="　">　 (U+3000)</option>
        <option value="、" selected>、</option>
        <option value="・">・</option>
        <option value="。">。</option>
        <option value=" ">обычный пробел</option>
      </select>
    </label>
  </div>

  <div class="opt-row">
    <label>Долгота ー:
      <input type="range" id="lengthen" min="0" max="100" value="25" style="width:140px">
      <span class="rate-val" id="lengthenVal">25%</span>
    </label>
    <label style="cursor:pointer">
      <input type="checkbox" id="gemination" checked> ッ на стыках слов
    </label>
  </div>

  <div class="hint">
    ー удлиняет гласную (даёт нажим, полезно для ударных). ッ даёт «запинку» перед согласной — работает на стыках слов.
  </div>
</div>

<div class="row">
  <button onclick="run()">Обработать</button>
  <button class="secondary" onclick="copyOut()" id="copyBtn">Копировать</button>
  <button class="secondary" onclick="clearAll()">Очистить</button>
</div>

<textarea id="output" readonly placeholder="Результат появится здесь..."></textarea>

<script>
"use strict";

/* ========== КРИПТОРАНДОМ ========== */
function cryptoRandom() {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] / 4294967296;
}
function cryptoChoice(arr) {
  return arr[Math.floor(cryptoRandom() * arr.length)];
}

/* ========== КАРТЫ СКРИПТОВ ========== */
const SCRIPTS = {
  latin: { map: {
    'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z',
    'и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r',
    'с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch',
    'ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
  }},
  cyrillic: { map: {
    'a':'а','b':'ь','c':'с','d':'д','e':'е','f':'ф','g':'г','h':'н','i':'и',
    'j':'ј','k':'к','l':'л','m':'м','n':'п','o':'о','p':'р','q':'ԛ','r':'г',
    's':'ѕ','t':'т','u':'и','v':'ѵ','w':'ш','x':'х','y':'у','z':'з'
  }},
  greek: { map: {
    'а':'α','б':'β','в':'β','г':'γ','д':'δ','е':'ε','ё':'ε','ж':'ζ','з':'ζ',
    'и':'ι','й':'ι','к':'κ','л':'λ','м':'μ','н':'ν','о':'ο','п':'π','р':'ρ',
    'с':'σ','т':'τ','у':'υ','ф':'φ','х':'χ','ц':'ψ','ч':'τ','ш':'σ','щ':'σ',
    'ъ':'','ы':'υ','ь':'','э':'ε','ю':'υ','я':'α',
    'a':'α','b':'β','c':'κ','d':'δ','e':'ε','f':'φ','g':'γ','h':'η','i':'ι',
    'j':'ι','k':'κ','l':'λ','m':'μ','n':'ν','o':'ο','p':'π','q':'κ','r':'ρ',
    's':'σ','t':'τ','u':'υ','v':'β','w':'ω','x':'χ','y':'υ','z':'ζ'
  }},
  armenian: { map: {
    'а':'ա','б':'բ','в':'վ','г':'գ','д':'դ','е':'ե','ё':'ե','ж':'ժ','з':'զ',
    'и':'ի','й':'յ','к':'կ','л':'լ','м':'մ','н':'ն','о':'օ','п':'պ','р':'ր',
    'с':'ս','т':'տ','у':'ու','ф':'ֆ','х':'խ','ц':'ց','ч':'չ','ш':'շ','щ':'շ',
    'ъ':'','ы':'ը','ь':'','э':'է','ю':'յու','я':'յա',
    'a':'ա','b':'բ','c':'ց','d':'դ','e':'ե','f':'ֆ','g':'գ','h':'հ','i':'ի',
    'j':'ջ','k':'կ','l':'լ','m':'մ','n':'ն','o':'օ','p':'պ','q':'ք','r':'ր',
    's':'ս','t':'տ','u':'ու','v':'վ','w':'վ','x':'խ','y':'յ','z':'զ'
  }}
};

/* ========== РАСШИРЕННАЯ КАТАКАНА ========== */
const KATAKANA = {
  '':  {a:'ア', i:'イ', u:'ウ', e:'エ', o:'オ', ya:'ヤ', yu:'ユ', yo:'ヨ'},
  'к': {a:'カ', i:'キ', u:'ク', e:'ケ', o:'コ', ya:'キャ', yu:'キュ', yo:'キョ'},
  'г': {a:'ガ', i:'ギ', u:'グ', e:'ゲ', o:'ゴ', ya:'ギャ', yu:'ギュ', yo:'ギョ'},
  'с': {a:'サ', i:'スィ', u:'ス', e:'セ', o:'ソ', ya:'シャ', yu:'シュ', yo:'ショ'},
  'з': {a:'ザ', i:'ズィ', u:'ズ', e:'ゼ', o:'ゾ', ya:'ジャ', yu:'ジュ', yo:'ジョ'},
  'т': {a:'タ', i:'ティ', u:'トゥ', e:'テ', o:'ト', ya:'チャ', yu:'チュ', yo:'チョ'},
  'д': {a:'ダ', i:'ディ', u:'ドゥ', e:'デ', o:'ド', ya:'ヂャ', yu:'ヂュ', yo:'ヂョ'},
  'н': {a:'ナ', i:'ニ', u:'ヌ', e:'ネ', o:'ノ', ya:'ニャ', yu:'ニュ', yo:'ニョ'},
  'х': {a:'ハ', i:'ヒ', u:'フ', e:'ヘ', o:'ホ', ya:'ヒャ', yu:'ヒュ', yo:'ヒョ'},
  'б': {a:'バ', i:'ビ', u:'ブ', e:'ベ', o:'ボ', ya:'ビャ', yu:'ビュ', yo:'ビョ'},
  'п': {a:'パ', i:'ピ', u:'プ', e:'ペ', o:'ポ', ya:'ピャ', yu:'ピュ', yo:'ピョ'},
  'м': {a:'マ', i:'ミ', u:'ム', e:'メ', o:'モ', ya:'ミャ', yu:'ミュ', yo:'ミョ'},
  'р': {a:'ラ', i:'リ', u:'ル', e:'レ', o:'ロ', ya:'リャ', yu:'リュ', yo:'リョ'},
  'л': {a:'ラ', i:'リ', u:'ル', e:'レ', o:'ロ', ya:'リャ', yu:'リュ', yo:'リョ'},
  'в': {a:'ヴァ', i:'ヴィ', u:'ヴ', e:'ヴェ', o:'ヴォ', ya:'ヴャ', yu:'ヴュ', yo:'ヴョ'},
  'ф': {a:'ファ', i:'フィ', u:'フ', e:'フェ', o:'フォ', ya:'フャ', yu:'フュ', yo:'フョ'},
  'ж': {a:'ジャ', i:'ジ', u:'ジュ', e:'ジェ', o:'ジョ'},
  'ш': {a:'シャ', i:'シ', u:'シュ', e:'シェ', o:'ショ'},
  'щ': {a:'シャ', i:'シ', u:'シュ', e:'シェ', o:'ショ'},
  'ч': {a:'チャ', i:'チ', u:'チュ', e:'チェ', o:'チョ'},
  'ц': {a:'ツァ', i:'ツィ', u:'ツ', e:'ツェ', o:'ツォ'}
};

/* карта ката→хира для простых и малых кана */
const KATA_TO_HIRA = {};
(function buildKataToHira(){
  for (let code = 0x30A1; code <= 0x30F6; code++) {
    KATA_TO_HIRA[String.fromCharCode(code)] =
      String.fromCharCode(code - 0x60);
  }
})();

const VOWEL_MAP = {
  'а':'a','э':'e','е':'e','ё':'yo','и':'i','ы':'i','о':'o','у':'u','ю':'yu','я':'ya',
  'a':'a','e':'e','i':'i','o':'o','u':'u','y':'i'
};

const VOWELS = 'аеёиоуыэюяАЕЁИОУЫЭЮЯaeiouyAEIOUY';

/* катаканные гласные-кана для вставки ー после них */
const VOWEL_KANA = new Set([
  'ア','イ','ウ','エ','オ','ヤ','ユ','ヨ',
  'ァ','ィ','ゥ','ェ','ォ','ャ','ュ','ョ'
]);

const LAT_TO_CYR_CONS = {
  'b':'б','c':'к','d':'д','f':'ф','g':'г','h':'х','j':'дж','k':'к','l':'л',
  'm':'м','n':'н','p':'п','q':'к','r':'р','s':'с','t':'т','v':'в','w':'в',
  'x':'кс','z':'з'
};

/* ========== УТИЛИТЫ ========== */
function isUpper(ch) {
  return ch !== ch.toLowerCase() && ch === ch.toUpperCase();
}

function mapChars(s, map) {
  let out = '';
  for (const ch of s) {
    const low = ch.toLowerCase();
    const mapped = map[low];
    if (mapped === undefined) { out += ch; continue; }
    if (isUpper(ch) && mapped.length > 0) {
      out += mapped.charAt(0).toUpperCase() + mapped.slice(1);
    } else {
      out += mapped;
    }
  }
  return out;
}

function kataToHira(s) {
  let out = '';
  for (const ch of s) {
    out += KATA_TO_HIRA[ch] !== undefined ? KATA_TO_HIRA[ch] : ch;
  }
  return out;
}

/* ========== РАЗБИЕНИЕ НА СЛОГИ ========== */
function splitSyllables(word) {
  const len = word.length;
  const bounds = [0];
  for (let i = 0; i < len; i++) {
    if (VOWELS.indexOf(word[i]) === -1) continue;
    let j = i;
    while (j > 0 && VOWELS.indexOf(word[j-1]) === -1) j--;
    if (j > 0 && j > bounds[bounds.length - 1]) bounds.push(j);
  }
  bounds.push(len);
  const uniq = [...new Set(bounds)].sort((a,b)=>a-b);
  const res = [];
  for (let i = 0; i < uniq.length - 1; i++) {
    if (uniq[i] < uniq[i+1]) res.push(word.slice(uniq[i], uniq[i+1]));
  }
  return res.length ? res : [word];
}

/* ========== СЛОГ → КАТАКАНА ========== */
function syllableToKatakana(syl, lengthenProb) {
  const low = syl.toLowerCase();
  let vi = -1;
  for (let i = 0; i < low.length; i++) {
    if (VOWEL_MAP[low[i]]) { vi = i; break; }
  }
  if (vi === -1) return null;

  const cluster = low.slice(0, vi);
  const vowel = low[vi];
  const v = VOWEL_MAP[vowel];
  const trailing = low.slice(vi + 1);

  const clusterCyr = [];
  for (const ch of cluster) {
    const n = LAT_TO_CYR_CONS[ch];
    if (n === undefined) clusterCyr.push(ch);
    else if (n.length === 1) clusterCyr.push(n);
    else return null;
  }

  let main = '';
  if (clusterCyr.length === 0) {
    main = KATAKANA[''][v] || vowel;
  } else {
    // все согласные кроме последней → слог с 'u'
    for (let i = 0; i < clusterCyr.length - 1; i++) {
      const k = KATAKANA[clusterCyr[i]];
      if (!k) return null;
      main += k['u'];
    }
    const lastC = clusterCyr[clusterCyr.length - 1];
    const k = KATAKANA[lastC];
    if (!k) return null;
    main += k[v] || k['u'];
  }

  // хвостовое 'н' → ン, остальные оставляем как есть
  let tail = '';
  for (const ch of trailing) {
    if (ch === 'н' || ch === 'n') tail += 'ン';
    else tail += ch;
  }

  // долгота ー — только если последний символ гласная-кана (или ン перед ней — не трогаем)
  let result = main;
  if (lengthenProb > 0 && cryptoRandom() < lengthenProb) {
    const lastCh = result.charAt(result.length - 1);
    // допускаем удлинение только после чистых гласных кана
    if (VOWEL_KANA.has(lastCh)) {
      result += 'ー';
    }
  }
  return result + tail;
}

/* ========== ТРАНСФОРМАЦИЯ СЛОГА ========== */
function transformSyllable(syl, scriptName, opts) {
  if (scriptName === 'katakana' || scriptName === 'hiragana') {
    const kata = syllableToKatakana(syl, opts.lengthenProb);
    if (kata === null) return mapChars(syl, SCRIPTS.latin.map);
    if (scriptName === 'hiragana') return kataToHira(kata);
    return kata;
  }
  const sc = SCRIPTS[scriptName];
  if (!sc) return syl;
  return mapChars(syl, sc.map);
}

/* ========== ГЕМИНАЦИЯ НА СТЫКАХ СЛОВ ========== */
/* правило: между двумя словами, где первое заканчивается на согласную,
   а второе начинается на согласную — вместо разделителя ставим ッ + разделитель */
function applyGemination(text, wordSep) {
  if (!wordSep || wordSep === ' ') return text;
  // Регексп: [согласная][разделитель][согласная]
  // согласная — кириллица/латиница, которая не гласная
  const consClass = '[A-Za-zА-Яа-яЁёBCDFGHJKLMNPQRSTVWXYZbcdfghjklmnpqrstvwxyz]';
  const consOnly  = '[BCDFGHJKLMNPQRSTVWXYZbcdfghjklmnpqrstvwxyzБВГДЖЗЙКЛМНПРСТФХЦЧШЩбвгджзйклмнпрстфхцчшщ]';
  const esc = wordSep.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(' + consOnly + ')(' + esc + ')(' + consOnly + ')', 'g');
  return text.replace(re, '$1ッ$2$3');
}

/* ========== ОБРАБОТКА ========== */
function processPlainText(text, rate, scripts, opts) {
  const syllableSep = opts.syllableSep || '';
  const wordSep = opts.wordSep !== undefined ? opts.wordSep : '\u3000';

  let out = text.replace(/[A-Za-zА-Яа-яЁё]+/g, word => {
    const sylls = splitSyllables(word);
    const processed = sylls.map(syl => {
      if (cryptoRandom() < rate) {
        return transformSyllable(syl, cryptoChoice(scripts), opts);
      }
      return syl;
    });
    return syllableSep ? processed.join(syllableSep) : processed.join('');
  });

  if (wordSep && wordSep !== ' ') {
    out = out.replaceAll(' ', wordSep);
  }
  if (opts.gemination) {
    out = applyGemination(out, wordSep);
  }
  return out;
}

function obfuscate(text, rate, scripts, opts) {
  const parts = [];
  const re = /\[[^\]]*\]/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push({ keep: false, v: text.slice(last, m.index) });
    parts.push({ keep: true, v: m[0] });
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ keep: false, v: text.slice(last) });
  return parts.map(p =>
    p.keep ? p.v : processPlainText(p.v, rate, scripts, opts)
  ).join('');
}

/* ========== UI ========== */
const input      = document.getElementById('input');
const output     = document.getElementById('output');
const rateEl     = document.getElementById('rate');
const rateVal    = document.getElementById('rateVal');
const lengthenEl = document.getElementById('lengthen');
const lengthenVal= document.getElementById('lengthenVal');
const geminEl    = document.getElementById('gemination');
const copyBtn    = document.getElementById('copyBtn');
const syllSepEl  = document.getElementById('syllSep');
const wordSepEl  = document.getElementById('wordSep');

rateEl.addEventListener('input', () => {
  rateVal.textContent = rateEl.value + '%';
});
lengthenEl.addEventListener('input', () => {
  lengthenVal.textContent = lengthenEl.value + '%';
});

function getActiveScripts() {
  const boxes = document.querySelectorAll('#scripts input[type=checkbox]');
  const arr = [];
  boxes.forEach(b => { if (b.checked) arr.push(b.dataset.script); });
  return arr.length ? arr : ['katakana'];
}

function getOpts() {
  return {
    syllableSep: syllSepEl.value,
    wordSep: wordSepEl.value,
    lengthenProb: parseInt(lengthenEl.value, 10) / 100,
    gemination: geminEl.checked
  };
}

function run() {
  const text = input.value;
  if (!text.trim()) { output.value = ''; return; }
  const rate = parseInt(rateEl.value, 10) / 100;
  const scripts = getActiveScripts();
  output.value = obfuscate(text, rate, scripts, getOpts());
}

function copyOut() {
  if (!output.value) return;
  output.select();
  document.execCommand('copy');
  copyBtn.textContent = 'Скопировано!';
  setTimeout(() => { copyBtn.textContent = 'Копировать'; }, 1200);
}

function clearAll() {
  input.value = '';
  output.value = '';
}

[rateEl, lengthenEl, geminEl, syllSepEl, wordSepEl].forEach(el => {
  el.addEventListener('change', run);
  el.addEventListener('input', () => {
    if (el.type === 'range') return; // ждём change
    run();
  });
});
document.querySelectorAll('#scripts input').forEach(b =>
  b.addEventListener('change', run));

input.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suno Оbfuscator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e6e8eb;
    max-width: 1000px; margin: 0 auto; padding: 24px; line-height: 1.5;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b92a0; font-size: 14px; margin-bottom: 20px; }
  textarea {
    width: 100%; min-height: 170px; padding: 12px;
    background: #171a21; color: #e6e8eb;
    border: 1px solid #2a2f3a; border-radius: 8px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 14px; resize: vertical; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #4a7cff; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  button {
    background: #4a7cff; color: white; border: none;
    padding: 10px 18px; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  button:hover { background: #3b6be0; }
  button.secondary { background: #2a2f3a; }
  button.secondary:hover { background: #363c48; }
  label { font-size: 14px; color: #b0b6c0; }
  input[type=range] { vertical-align: middle; }
  .controls {
    background: #171a21; border: 1px solid #2a2f3a;
    border-radius: 8px; padding: 14px 16px; margin: 12px 0;
  }
  .scripts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
  .scripts label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .rate-val { display: inline-block; min-width: 44px; color: #4a7cff; font-weight: 600; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
  #output { min-height: 170px; }
</style>
</head>
<body>

<h1>🎵 Suno Оbfuscator</h1>
<div class="sub">Обфускация текста песен для обхода детекции. Скобки [Verse] не трогаются.</div>

<textarea id="input" placeholder="Вставь текст сюда...&#10;&#10;[Куплет 1]&#10;Я помню чудное мгновенье&#10;Передо мной явилась ты..."></textarea>

<div class="controls">
  <div class="row" style="margin:0">
    <label>Интенсивность:</label>
    <input type="range" id="rate" min="0" max="100" value="50" style="flex:1;max-width:300px">
    <span class="rate-val" id="rateVal">50%</span>
  </div>
  <div class="scripts" id="scripts">
    <label><input type="checkbox" data-script="latin" checked> Латиница</label>
    <label><input type="checkbox" data-script="cyrillic"> Кириллица-гомоглифы</label>
    <label><input type="checkbox" data-script="greek" checked> Греческий</label>
    <label><input type="checkbox" data-script="armenian"> Армянский</label>
    <label><input type="checkbox" data-script="hiragana" checked> ひらがな</label>
    <label><input type="checkbox" data-script="katakana" checked> カタカナ</label>
  </div>
  <div class="hint">Замена происходит по слогам. Внутри скобок [] ничего не меняется.</div>
</div>

<div class="row">
  <button onclick="run()">Обработать</button>
  <button class="secondary" onclick="copyOut()" id="copyBtn">Копировать</button>
  <button class="secondary" onclick="clearAll()">Очистить</button>
</div>

<textarea id="output" readonly placeholder="Результат появится здесь..."></textarea>

<script>
"use strict";

/* ========== КРИПТОРАНДОМ ========== */
function cryptoRandom() {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] / 4294967296;
}
function cryptoChoice(arr) {
  return arr[Math.floor(cryptoRandom() * arr.length)];
}

/* ========== КАРТЫ СКРИПТОВ ========== */
/* Каждая карта: ключ — символ (нижний регистр, кириллица или латиница),
   значение — его фонетический эквивалент в целевом скрипте. */

const SCRIPTS = {
  latin: {
    map: {
      // Кириллица → латиница
      'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z',
      'и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r',
      'с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch',
      'ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
    }
  },
  cyrillic: {
    map: {
      // Латиница → кириллица (визуальные гомоглифы)
      'a':'а','b':'ь','c':'с','d':'д','e':'е','f':'ф','g':'г','h':'н','i':'и',
      'j':'ј','k':'к','l':'л','m':'м','n':'п','o':'о','p':'р','q':'ԛ','r':'г',
      's':'ѕ','t':'т','u':'и','v':'ѵ','w':'ш','x':'х','y':'у','z':'з'
    }
  },
  greek: {
    map: {
      // Кириллица → греческий
      'а':'α','б':'β','в':'β','г':'γ','д':'δ','е':'ε','ё':'ε','ж':'ζ','з':'ζ',
      'и':'ι','й':'ι','к':'κ','л':'λ','м':'μ','н':'ν','о':'ο','п':'π','р':'ρ',
      'с':'σ','т':'τ','у':'υ','ф':'φ','х':'χ','ц':'ψ','ч':'τ','ш':'σ','щ':'σ',
      'ъ':'','ы':'υ','ь':'','э':'ε','ю':'υ','я':'α',
      // Латиница → греческий
      'a':'α','b':'β','c':'κ','d':'δ','e':'ε','f':'φ','g':'γ','h':'η','i':'ι',
      'j':'ι','k':'κ','l':'λ','m':'μ','n':'ν','o':'ο','p':'π','q':'κ','r':'ρ',
      's':'σ','t':'τ','u':'υ','v':'β','w':'ω','x':'χ','y':'υ','z':'ζ'
    }
  },
  armenian: {
    map: {
      // Кириллица → армянский
      'а':'ա','б':'բ','в':'վ','г':'գ','д':'դ','е':'ե','ё':'ե','ж':'ժ','з':'զ',
      'и':'ի','й':'յ','к':'կ','л':'լ','м':'մ','н':'ն','о':'օ','п':'պ','р':'ր',
      'с':'ս','т':'տ','у':'ու','ф':'ֆ','х':'խ','ц':'ց','ч':'չ','ш':'շ','щ':'շ',
      'ъ':'','ы':'ը','ь':'','э':'է','ю':'յու','я':'յա',
      // Латиница → армянский
      'a':'ա','b':'բ','c':'ց','d':'դ','e':'ե','f':'ֆ','g':'գ','h':'հ','i':'ի',
      'j':'ջ','k':'կ','l':'լ','m':'մ','n':'ն','o':'օ','p':'պ','q':'ք','r':'ր',
      's':'ս','t':'տ','u':'ու','v':'վ','w':'վ','x':'խ','y':'յ','z':'զ'
    }
  }
};

/* ========== ЯПОНСКИЕ СЛОГИ ========== */
const KANA_CONS = {
  '': {a:'あ', i:'い', u:'う', e:'え', o:'お', ya:'や', yu:'ゆ', yo:'よ'},
  'к': {a:'か', i:'き', u:'く', e:'け', o:'こ', ya:'きゃ', yu:'きゅ', yo:'きょ'},
  'г': {a:'が', i:'ぎ', u:'ぐ', e:'げ', o:'ご', ya:'ぎゃ', yu:'ぎゅ', yo:'ぎょ'},
  'с': {a:'さ', i:'し', u:'す', e:'せ', o:'そ', ya:'しゃ', yu:'しゅ', yo:'しょ'},
  'з': {a:'ざ', i:'じ', u:'ず', e:'ぜ', o:'ぞ', ya:'じゃ', yu:'じゅ', yo:'じょ'},
  'т': {a:'た', i:'ち', u:'つ', e:'て', o:'と', ya:'ちゃ', yu:'ちゅ', yo:'ちょ'},
  'д': {a:'だ', i:'ぢ', u:'づ', e:'で', o:'ど', ya:'ぢゃ', yu:'ぢゅ', yo:'ぢょ'},
  'н': {a:'な', i:'に', u:'ぬ', e:'ね', o:'の', ya:'にゃ', yu:'にゅ', yo:'にょ'},
  'х': {a:'は', i:'ひ', u:'ふ', e:'へ', o:'ほ', ya:'ひゃ', yu:'ひゅ', yo:'ひょ'},
  'б': {a:'ば', i:'び', u:'ぶ', e:'べ', o:'ぼ', ya:'びゃ', yu:'びゅ', yo:'びょ'},
  'п': {a:'ぱ', i:'ぴ', u:'ぷ', e:'ぺ', o:'ぽ', ya:'ぴゃ', yu:'ぴゅ', yo:'ぴょ'},
  'м': {a:'ま', i:'み', u:'む', e:'め', o:'も', ya:'みゃ', yu:'みゅ', yo:'みょ'},
  'р': {a:'ら', i:'り', u:'る', e:'れ', o:'ろ', ya:'りゃ', yu:'りゅ', yo:'りょ'},
  'л': {a:'ら', i:'り', u:'る', e:'れ', o:'ろ', ya:'りゃ', yu:'りゅ', yo:'りょ'},
  'в': {a:'わ', i:'い', u:'う', e:'え', o:'を', ya:'わ', yu:'う', yo:'を'},
  'ф': {a:'ふぁ', i:'ふぃ', u:'ふ', e:'ふぇ', o:'ふぉ'},
  'ж': {a:'じゃ', i:'じ', u:'じゅ', e:'じぇ', o:'じょ'},
  'ш': {a:'しゃ', i:'し', u:'しゅ', e:'しぇ', o:'しょ'},
  'щ': {a:'しゃ', i:'し', u:'しゅ', e:'しぇ', o:'しょ'},
  'ч': {a:'ちゃ', i:'ち', u:'ちゅ', e:'ちぇ', o:'ちょ'},
  'ц': {a:'つぁ', i:'ち', u:'つ', e:'つぇ', o:'つぉ'}
};

const VOWEL_MAP = {
  'а':'a','э':'e','е':'e','ё':'yo','и':'i','ы':'i','о':'o','у':'u','ю':'yu','я':'ya',
  'a':'a','e':'e','i':'i','o':'o','u':'u','y':'i'
};

const VOWELS = 'аеёиоуыэюяАЕЁИОУЫЭЮЯaeiouyAEIOUY';

const LAT_TO_CYR_CONS = {
  'b':'б','c':'к','d':'д','f':'ф','g':'г','h':'х','j':'дж','k':'к','l':'л',
  'm':'м','n':'н','p':'п','q':'к','r':'р','s':'с','t':'т','v':'в','w':'в',
  'x':'кс','z':'з'
};

/* ========== УТИЛИТЫ ========== */
function isUpper(ch) {
  return ch !== ch.toLowerCase() && ch === ch.toUpperCase();
}

function mapChars(s, map) {
  let out = '';
  for (const ch of s) {
    const low = ch.toLowerCase();
    const mapped = map[low];
    if (mapped === undefined) { out += ch; continue; }
    if (isUpper(ch) && mapped.length > 0) {
      out += mapped.charAt(0).toUpperCase() + mapped.slice(1);
    } else {
      out += mapped;
    }
  }
  return out;
}

function hiraToKata(s) {
  return s.replace(/[\u3041-\u3096]/g, c =>
    String.fromCharCode(c.charCodeAt(0) + 0x60));
}

/* ========== РАЗБИЕНИЕ НА СЛОГИ ========== */
function splitSyllables(word) {
  const len = word.length;
  const bounds = [0];
  for (let i = 0; i < len; i++) {
    if (VOWELS.indexOf(word[i]) === -1) continue;
    // ищем начало кластера согласных прямо перед этой гласной
    let j = i;
    while (j > 0 && VOWELS.indexOf(word[j-1]) === -1) j--;
    if (j > 0 && j > bounds[bounds.length - 1]) bounds.push(j);
  }
  bounds.push(len);
  const uniq = [...new Set(bounds)].sort((a,b)=>a-b);
  const res = [];
  for (let i = 0; i < uniq.length - 1; i++) {
    if (uniq[i] < uniq[i+1]) res.push(word.slice(uniq[i], uniq[i+1]));
  }
  return res.length ? res : [word];
}

/* ========== СЛОГ → КАНА ========== */
function syllableToKana(syl) {
  const low = syl.toLowerCase();
  let vi = -1;
  for (let i = 0; i < low.length; i++) {
    if (VOWEL_MAP[low[i]]) { vi = i; break; }
  }
  if (vi === -1) return null;

  const cluster = low.slice(0, vi);
  const vowel = low[vi];
  const v = VOWEL_MAP[vowel];
  const trailing = low.slice(vi + 1);

  // нормализуем латинские согласные в кириллические ключи
  const clusterCyr = [];
  for (const ch of cluster) {
    const n = LAT_TO_CYR_CONS[ch];
    if (n === undefined) clusterCyr.push(ch);
    else if (n.length === 1) clusterCyr.push(n);
    else return null; // 'кс', 'дж' — не поддерж.
  }

  let out = '';
  if (clusterCyr.length === 0) {
    out += KANA_CONS[''][v] || vowel;
  } else {
    // все согласные, кроме последней, получают 'u'
    for (let i = 0; i < clusterCyr.length - 1; i++) {
      const k = KANA_CONS[clusterCyr[i]];
      if (!k) return null;
      out += k['u'];
    }
    const lastC = clusterCyr[clusterCyr.length - 1];
    const k = KANA_CONS[lastC];
    if (!k) return null;
    out += k[v] || k['u'];
  }
  // хвостовые согласные: 'н' → ん, остальные оставляем кириллицей
  for (const ch of trailing) {
    if (ch === 'н' || ch === 'n') out += 'ん';
    else out += ch;
  }
  return out;
}

/* ========== ТРАНСФОРМАЦИЯ СЛОГА ========== */
function transformSyllable(syl, scriptName) {
  if (scriptName === 'hiragana' || scriptName === 'katakana') {
    const kana = syllableToKana(syl);
    if (kana === null) {
      // откат на латиницу
      return mapChars(syl, SCRIPTS.latin.map);
    }
    return scriptName === 'katakana' ? hiraToKata(kana) : kana;
  }
  const sc = SCRIPTS[scriptName];
  if (!sc) return syl;
  return mapChars(syl, sc.map);
}

/* ========== ОБРАБОТКА ТЕКСТА ========== */
function processPlainText(text, rate, scripts) {
  // работаем только с буквенными словами
  return text.replace(/[A-Za-zА-Яа-яЁё]+/g, word => {
    const sylls = splitSyllables(word);
    let result = '';
    for (const syl of sylls) {
      if (cryptoRandom() < rate) {
        const script = cryptoChoice(scripts);
        result += transformSyllable(syl, script);
      } else {
        result += syl;
      }
    }
    return result;
  });
}

function obfuscate(text, rate, scripts) {
  const parts = [];
  const re = /\[[^\]]*\]/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push({ keep: false, v: text.slice(last, m.index) });
    parts.push({ keep: true, v: m[0] });
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ keep: false, v: text.slice(last) });

  return parts.map(p =>
    p.keep ? p.v : processPlainText(p.v, rate, scripts)
  ).join('');
}

/* ========== UI ========== */
const input   = document.getElementById('input');
const output  = document.getElementById('output');
const rateEl  = document.getElementById('rate');
const rateVal = document.getElementById('rateVal');
const copyBtn = document.getElementById('copyBtn');

rateEl.addEventListener('input', () => {
  rateVal.textContent = rateEl.value + '%';
});

function getActiveScripts() {
  const boxes = document.querySelectorAll('#scripts input[type=checkbox]');
  const arr = [];
  boxes.forEach(b => { if (b.checked) arr.push(b.dataset.script); });
  return arr.length ? arr : ['latin'];
}

function run() {
  const text = input.value;
  if (!text.trim()) { output.value = ''; return; }
  const rate = parseInt(rateEl.value, 10) / 100;
  const scripts = getActiveScripts();
  output.value = obfuscate(text, rate, scripts);
}

function copyOut() {
  if (!output.value) return;
  output.select();
  document.execCommand('copy');
  copyBtn.textContent = 'Скопировано!';
  setTimeout(() => { copyBtn.textContent = 'Копировать'; }, 1200);
}

function clearAll() {
  input.value = '';
  output.value = '';
}

/* авто-регенерация при изменении параметров */
rateEl.addEventListener('change', run);
document.querySelectorAll('#scripts input').forEach(b =>
  b.addEventListener('change', run));

/* обработка по Ctrl+Enter */
input.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
});
</script>
</body>
</html>
